name: Deploy qclaw_factor_engine (Production)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        server:
          # 第一台服务器：沿用原有 secrets 命名
          - name: server1
            host: ${{ secrets.SERVER_HOST }}
            username: ubuntu
            ssh_key: ${{ secrets.SERVER_SSH_KEY }}
            deploy_dir: /data/qclaw/qclaw_factor_engine
            conda_activate: /home/ubuntu/miniconda3/bin/activate
            conda_env: base
          # 第二台服务器：新增带序号的 secrets
          - name: server2
            host: ${{ secrets.SERVER_HOST_2 }}
            username: ubuntu
            ssh_key: ${{ secrets.SERVER_SSH_KEY_2 }}
            deploy_dir: /data/qclaw/qclaw_factor_engine
            conda_activate: /home/ubuntu/miniconda3/bin/activate
            conda_env: base

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to ${{ matrix.server.name }} (ubuntu + Miniconda)
      env:
        SERVER_HOST: ${{ matrix.server.host }}
        SERVER_USERNAME: ${{ matrix.server.username }}
        SSH_PRIVATE_KEY: ${{ matrix.server.ssh_key }}
        DEPLOY_DIR: ${{ matrix.server.deploy_dir }}
        CONDA_ACTIVATE: ${{ matrix.server.conda_activate }}
        CONDA_ENV: ${{ matrix.server.conda_env }}
      run: |
        set -x

        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        echo "Host server
          HostName $SERVER_HOST
          User $SERVER_USERNAME
          IdentityFile ~/.ssh/deploy_key
          StrictHostKeyChecking no
          UserKnownHostsFile=/dev/null
          GlobalKnownHostsFile=/dev/null
          LogLevel INFO" >> ~/.ssh/config

        ssh -o IdentitiesOnly=yes server "echo 'SSH connection successful'"

        # 确保部署目录存在
        ssh server "sudo mkdir -p ${DEPLOY_DIR} && sudo chown -R ${SERVER_USERNAME}:${SERVER_USERNAME} ${DEPLOY_DIR}"

        # 上传代码（排除 .git 等）
        rsync -avz --exclude '.git*' --exclude '.venv' --exclude '__pycache__' -e "ssh" ./ server:${DEPLOY_DIR}/

        # 设置脚本执行权限
        ssh server "
          chmod +x ${DEPLOY_DIR}/bin/run_daily_factor_pipeline.sh
          chmod +x ${DEPLOY_DIR}/bin/run_weekly_factor_pipeline.sh
          chmod +x ${DEPLOY_DIR}/bin/run_pipeline_job_worker_once.sh
        "

        # 安装依赖（生产用 miniconda）
        ssh server "
          source ${CONDA_ACTIVATE} ${CONDA_ENV} &&
          python --version &&
          pip --version &&
          cd ${DEPLOY_DIR} &&
          pip install -r requirements.txt
        "

