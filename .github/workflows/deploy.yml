name: Deploy qclaw_factor_engine (Production)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        server_no: [1, 2]

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to server${{ matrix.server_no }} (ubuntu + Miniconda)
      env:
        # 不能在 matrix 中直接引用 secrets，这里按 server_no 分支取值
        SERVER_HOST: ${{ matrix.server_no == 1 && secrets.SERVER_HOST || secrets.SERVER_HOST_2 }}
        SSH_PRIVATE_KEY: ${{ matrix.server_no == 1 && secrets.SERVER_SSH_KEY || secrets.SERVER_SSH_KEY_2 }}
        SERVER_USERNAME: ubuntu
        DEPLOY_DIR: /data/qclaw/qclaw_factor_engine
        CONDA_ACTIVATE: /home/ubuntu/miniconda3/bin/activate
        CONDA_ENV: base
      run: |
        set -x

        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        echo "Host server
          HostName $SERVER_HOST
          User $SERVER_USERNAME
          IdentityFile ~/.ssh/deploy_key
          StrictHostKeyChecking no
          UserKnownHostsFile=/dev/null
          GlobalKnownHostsFile=/dev/null
          LogLevel INFO" >> ~/.ssh/config

        ssh -o IdentitiesOnly=yes server "echo 'SSH connection successful'"

        # 确保部署目录存在
        ssh server "sudo mkdir -p ${DEPLOY_DIR} && sudo chown -R ${SERVER_USERNAME}:${SERVER_USERNAME} ${DEPLOY_DIR}"

        # 上传代码（排除 .git 等）
        rsync -avz --exclude '.git*' --exclude '.venv' --exclude '__pycache__' -e "ssh" ./ server:${DEPLOY_DIR}/

        # 设置脚本执行权限
        ssh server "
          chmod +x ${DEPLOY_DIR}/bin/run_daily_factor_pipeline.sh
          chmod +x ${DEPLOY_DIR}/bin/run_weekly_factor_pipeline.sh
          chmod +x ${DEPLOY_DIR}/bin/run_pipeline_job_worker_once.sh
          chmod +x ${DEPLOY_DIR}/bin/run_cos_sync_factor_export_parquet.sh
          chmod +x ${DEPLOY_DIR}/bin/run_cos_upload_daily.sh
          chmod +x ${DEPLOY_DIR}/bin/run_cos_upload_full.sh
          chmod +x ${DEPLOY_DIR}/bin/run_daily_full_pipeline.sh
          chmod +x ${DEPLOY_DIR}/bin/run_daily_parquet_export_pipeline.sh
          chmod +x ${DEPLOY_DIR}/bin/run_monthly_parquet_backfill.sh
        "
        #如果miniconda3不存在，则安装miniconda3
        ssh server "
          if [ ! -d /home/ubuntu/miniconda3 ]; then
            wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
            bash Miniconda3-latest-Linux-x86_64.sh -b -p /home/ubuntu/miniconda3
            source /home/ubuntu/miniconda3/bin/activate
          fi
        "

        # 安装依赖（生产用 miniconda）
        ssh server "
          source ${CONDA_ACTIVATE} ${CONDA_ENV} &&
          python --version &&
          pip --version &&
          cd ${DEPLOY_DIR} &&
          pip install -r requirements.txt
        "

