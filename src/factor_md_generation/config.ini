[paths]
; 因子 Markdown 根目录（相对项目根）。默认落盘：LLM → 其下 llm/，手写 → manual/；解析器会递归扫描整棵目录
factor_docs_dir = ./factor_docs/md

[llm_gateway]
baseUrl = https://api.lkeap.cloud.tencent.com/v1
; 生产：填写 apiKey 或使用环境变量 LKEAP_API_KEY（非空时优先）
apiKey =
model = deepseek-v3.2
thinking_type = enabled
timeout_sec = 120
max_tokens = 8192
temperature = 0.2
vision_model =
