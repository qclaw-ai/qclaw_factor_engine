; 日更因子值 runner 配置样例
; 复制为 config.ini / config_dev.ini 后修改数据库连接

[database]
db_host = localhost
db_port = 5432
db_user = postgres
db_password =
db_name = db_factor

; 日更行为
[daily]
; 引擎计算 warmup：根配置 [factor_incremental].warmup_trading_days；行情自然日回填见 daily_stock_and_calendar_sync
; all_in_basic（执行日更默认） | valid_only（研究/降本）
scope = all_in_basic
; 日更所属域（支持 ALL_A 自动归一为 ALL）
universe = ZZ500

; P0 配置统一说明：
; - 若本文件缺少 [daily] 某个键，runner 会回退读取仓库根 config.ini / config_dev.ini 的同名键。
