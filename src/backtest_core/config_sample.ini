[database]
db_host = 127.0.0.1
db_port = 5432
db_user = postgres
db_password = your_password_here
db_name = qclaw_factor_engine

[backtest]
; 回测 horizon（单位：交易日）
horizon = 5

; 分层数量
n_quantiles = 10

; 历史字段：目录 CSV 扫描回测已移除；须 use_factor_value_files=true 并从 factor_value_files 读 yearly_parquet
factor_output_dir = factor_values

; true：从 factor_value_files 选 yearly_parquet 路径（默认 true）
use_factor_value_files = true

; 可选：仅回测这些因子ID（逗号分隔）；留空则对库中已登记因子的 yearly_parquet 回测
factor_ids =

; 大回测实证域（写入 factor_backtest.test_universe），默认全市场
test_universe = ALL

