sync_factor_values_execution_universe = ALL

[jq]
user =
password =

[selection]
scene = A_stock_daily_single_factor
primary_universe_for_file_pointer = ALL

[factor_corr]
enable = true
test_universe = ALL
window_days = 252
min_overlap_days = 120
redis_key_prefix = factor:corr
keep_days = 30
factor_output_root = factor_values/by_universe
factor_ids =
as_of_date =
use_factor_value_files = true

[factor_incremental]
factor_engine_config_file = config.ini
mode = incremental
stage = candidate
warmup_trading_days = 200

[data_ingest]
mode = full
universe = ALL
stock_codes =
start_date = 2025-01-01
end_date = 2025-12-31
adjust = qfq

[data_ingest_jq_initial]
start_date = 2025-01-01
end_date = 2025-12-31
universe = ALL
stock_codes =
batch_size = 20

[mysql_source]
enabled = false
host =
port = 3306
user =
password =
db_name =
dailyquote_table = DailyQuote
calendar_table = Calendar
dailyquote_tradedate_format = date
calendar_tradedate_format = date
symbol_filter = true

[crawler]
sources = fd
max_factors_per_run = 10

[sources.fd]
base_url = https://factors.directory
search_keywords = momentum,value

[llm_gateway]
baseUrl = https://api.lkeap.cloud.tencent.com/v1
apiKey =
model = deepseek-v3.2
thinking_type = enabled
timeout_sec = 120
max_tokens = 8192
temperature = 0.2
vision_model =

[monitor]
universe = ALL
horizon_days = 5
monitor_window_trading_days = 60
warmup_trading_days = 60
threshold_scene = factor_monthly_monitor_ALL
coverage_min_fallback = 0.8
ic_mean_min_fallback = 0.0
ic_ir_min_fallback = 0.0
max_factors = 0
parity_sample_factors = 5
parity_sample_days = 5
parity_tolerance = 1e-6
random_seed = 42

[redis]
host = localhost
port = 6379
