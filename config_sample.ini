; qclaw_factor_engine 根配置模板（硬切换版）
; 规则：
; 1) 所有模块默认只读仓库根 config.ini（dev 环境自动切到 config_dev.ini）
; 2) CLI --config 传参优先级最高

; ------------------------------
; [database]
; 被调用模块/脚本：
; - src/common/db.py（所有需要数据库连接的模块都会走这里）
; - 典型：factor_engine_runner.py / daily_factor_values_runner.py / backtest_* / selection_and_store / factor_monitor / data_ingest/*
; ------------------------------
[database]
db_host = localhost
db_port = 5432
db_user = postgres
db_password =
db_name = db_factor

; ------------------------------
; [paths]
; 被调用模块/脚本：
; - factor_docs_parser.py / factor_crawler_runner.py / factor_md_generation/io_paths.py -> factor_docs_dir
; - backtest_io_runner.py / selection_and_store_runner.py -> backtest_results_dir
; - factor_monitor_runner.py -> output_dir
; ------------------------------
[paths]
factor_docs_dir = ./factor_docs/md
backtest_results_dir = backtest_results
output_dir = artifacts/factor_monitor
logs_dir = ./logs

; ------------------------------
; [jq]
; 被调用模块/脚本：
; - factor_engine_runner.py（非 ALL 域解析股票池时）
; - data_ingest/data_ingest_stock_daily_jq_initial.py
; - data_ingest/daily_stock_and_calendar_sync.py（MySQL 失败或未启用时聚宽兜底）
;
; 说明：聚宽日线入库请与 [data_ingest_jq_initial] 同用；本节只放账号，不放股票池。
; ------------------------------
[jq]
user =
password =

; ------------------------------
; [daily]
; 被调用模块/脚本：
; - src/daily_factor_values/daily_factor_values_runner.py
; ------------------------------
[daily]
; 因子引擎计算回看：见 [factor_incremental].warmup_trading_days；行情入库自然日回看见 daily_stock_and_calendar_sync --lookback-days
scope = all_in_basic
universe = ALL

; ------------------------------
; [factor_engine]
; 被调用模块/脚本：
; - src/factor_engine/factor_engine_runner.py
; - src/factor_monitor/factor_monitor_runner.py（通过 _load_stock_daily 复用行情加载）
; ------------------------------
[factor_engine]
start_date = 2025-01-01
end_date = 2025-12-31
factor_ids =
universe = ALL
batch_id =
skip_factor_ids =
; 幂等跳过：日更看是否已有 factors.parquet；批量看 yearly_parquet 是否已覆盖 publish 各年。默认 true；不写亦为 true；强制重算请 false。
skip_if_artifact_record_exists = true

; Parquet 年度主文件（见 docs/因子工厂_Parquet主存储改造方案_v1.md）
yearly_parquet_enabled = true
; 日更多因子 bundle：factor_values_parquet/daily/.../factors.parquet
daily_parquet_bundle_enabled = true

; ------------------------------
; [factor_incremental]
; 被调用模块/脚本：
; - src/factor_incremental/factor_incremental_runner.py
; ------------------------------
[factor_incremental]
factor_engine_config_file = config.ini
mode = incremental
stage = candidate
warmup_trading_days = 200

; ------------------------------
; [factor_export]
; 被调用模块/脚本：
; - src/factor_export_cos/factor_export_runner.py（因子）
; - src/factor_export_cos/label_export_runner.py（stock_daily→y_ret_1d，输出同树根目录）
; - scripts/bootstrap_factor_export_history.py（因子按月回填）/ scripts/bootstrap_label_export_history.py（仅 label）
; ------------------------------
[factor_export]
output_root = artifacts/factor_export_parquet

; ------------------------------
; [cos_factor_export]
; COS 上传配置（全量 / 每日增量共用一套前缀与密钥）。
;
; 被调用模块/脚本：
; - scripts/upload_factor_export_parquet_full.py
; - scripts/upload_factor_export_parquet_daily.py
;
; 说明：
; - 建议优先通过本节配置 COS endpoint / bucket / 密钥等信息；
; - CLI 参数仍可覆盖本节配置，方便测试临时切换；
; - 不再依赖环境变量 COS_REGION / COS_ENDPOINT / COS_SECRET_ID / COS_SECRET_KEY。
; ------------------------------
[cos_factor_export]
local_root = artifacts/factor_export_parquet
cos_root = factor_export_parquet
bucket =
region = ap-shanghai
endpoint =
secret_id =
secret_key =
workers = 8


; ------------------------------
; [backtest]
; 被调用模块/脚本：
; - src/backtest_core/backtest_core_runner.py
; - src/backtest_io/backtest_io_runner.py（间接调用 backtest_core）
; ------------------------------
[backtest]
horizon = 5
n_quantiles = 10
; 历史字段：目录 CSV 扫描回测已移除；须 use_factor_value_files=true 并从 factor_value_files 读 yearly_parquet
factor_output_dir = factor_values
use_factor_value_files = true
factor_ids =
test_universe = ALL

; ------------------------------
; [selection]
; 被调用模块/脚本：
; - src/selection_and_store/selection_and_store_runner.py
; ------------------------------
[selection]
scene = A_stock_daily_single_factor
primary_universe_for_file_pointer = ALL

; ------------------------------
; [factor_corr]
; 被调用模块/脚本：
; - src/factor_corr/factor_corr_matrix.py
; ------------------------------
[factor_corr]
enable = true
test_universe = ALL
window_days = 252
min_overlap_days = 120
redis_key_prefix = factor:corr
keep_days = 30
factor_ids =
as_of_date =
use_factor_value_files = true

; ------------------------------
; [redis]
; 被调用模块/脚本：
; - src/factor_corr/factor_corr_matrix.py
; ------------------------------
[redis]
host = localhost
port = 6379
db = 0
password =

; ------------------------------
; [monitor]
; 被调用模块/脚本：
; - src/factor_monitor/factor_monitor_runner.py
; ------------------------------
[monitor]
universe = ALL
horizon_days = 5
monitor_window_trading_days = 60
warmup_trading_days = 60
threshold_scene = factor_monthly_monitor_ALL
coverage_min_fallback = 0.8
ic_mean_min_fallback = 0.0
ic_ir_min_fallback = 0.0
max_factors = 0
parity_sample_factors = 5
parity_sample_days = 5
parity_tolerance = 1e-6
random_seed = 42

; ------------------------------
; 行情入库：两段配置关系（cron 常用 bin/run_daily_factor_pipeline.sh → 先做 daily_stock_and_calendar_sync）
;
; 【推荐 / 聚宽主线】—— 日常只维护「[jq] + [data_ingest_jq_initial]」即可：
;   - AkShare 不跑也行；股票池以 [data_ingest_jq_initial] 的 universe / stock_codes 为准，
;     batch_size 为聚宽 get_price 分批大小。
;
; 【[data_ingest]】—— 仅服务于 AkShare：
;   - 只被 src/data_ingest/data_ingest_stock_daily.py 读取（mode/start_date/end_date/adjust/daily_lookback_days）。
;   - daily_stock_and_calendar_sync 在用聚宽解析股票池时：先 [data_ingest_jq_initial]，若该节无有效 universe
;     结果再回退本节；故在「已不用 AkShare」时仍建议保留与本业务一致的 universe（或抄 jq_initial），
;     避免回退时股票池意外为空。
;
; 【[data_ingest_jq_initial]】—— 聚宽首包/回填与「日更聚宽兜底」共用：
;   - data_ingest_stock_daily_jq_initial.py
;   - daily_stock_and_calendar_sync.py（聚宽写 stock_daily + calendar 时：universe、stock_codes、batch_size）。
;   - 兼容旧 ini：batch_size 未设或无效时，代码可再读 [sync] jq_batch_size（见仓库内 daily_stock_and_calendar_sync._jq_get_price_batch_size）。
; ------------------------------

; ------------------------------
; [data_ingest]
; （仅 AkShare，见本节上方「两段配置关系」）
; ------------------------------
[data_ingest]
mode = full
universe = ALL
stock_codes =
start_date = 2025-01-01
end_date = 2025-12-31
adjust = qfq
daily_lookback_days = 5

; ------------------------------
; [data_ingest_jq_initial]
; （聚宽主配置，见本节上方「两段配置关系」）
; ------------------------------
[data_ingest_jq_initial]
start_date = 2025-01-01
end_date = 2025-12-31
universe = ALL
stock_codes =
batch_size = 20

; ------------------------------
; [mysql_source]
; 被调用模块/脚本：
; - src/data_ingest/daily_stock_and_calendar_sync.py
; ------------------------------
[mysql_source]
enabled = false
host =
port = 3306
user =
password =
db_name =
dailyquote_table = DailyQuote
calendar_table = Calendar
dailyquote_tradedate_format = date
calendar_tradedate_format = date
calendar_sync_mode = all
stock_sync_chunk_days = 3
symbol_filter = true

; ------------------------------
; [crawler]
; [sources.fd]
; 被调用模块/脚本：
; - src/factor_crawler/factor_crawler_runner.py
; ------------------------------
[crawler]
sources = fd
max_factors_per_run = 10

[sources.fd]
base_url = https://factors.directory
search_keywords = momentum,value

; ------------------------------
; [llm_gateway]
; 被调用模块/脚本：
; - src/factor_md_generation/llm_md/llm_client.py
; ------------------------------
[llm_gateway]
baseUrl = https://api.lkeap.cloud.tencent.com/v1
apiKey =
model = deepseek-v3.2
thinking_type = enabled
timeout_sec = 120
max_tokens = 8192
temperature = 0.2
vision_model =
